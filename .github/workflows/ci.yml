name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install pipeline-guard (with dev deps)
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -v --cov=pipeline_guard --cov-report=term-missing

  self-scan-demo:
    name: pipeline-guard scans its own fixtures
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline-guard
        run: pip install .

      - name: Scan the clean fixtures (expected to pass)
        run: |
          pipeline-guard scan \
            --dockerfile fixtures/docker/Dockerfile.clean \
            --terraform-plan fixtures/terraform/clean/plan.json \
            --k8s fixtures/k8s/deployment-clean.yaml \
            --report-out /tmp/clean-report.md

      - name: Scan the vulnerable fixtures (expected to block)
        # This step demonstrates the gate actually blocking a bad build end
        # to end; `!` inverts the exit code since a real PR *should* fail here.
        run: |
          ! pipeline-guard scan \
            --dockerfile fixtures/docker/Dockerfile.vulnerable \
            --trivy-report fixtures/trivy/report-vulnerable.json \
            --terraform-plan fixtures/terraform/vulnerable/plan.json \
            --k8s fixtures/k8s/deployment-vulnerable.yaml \
            --report-out /tmp/vulnerable-report.md \
            --json-out /tmp/vulnerable-report.json

      - name: Upload sample reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-guard-sample-reports
          path: /tmp/*-report.*
